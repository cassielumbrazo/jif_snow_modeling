[General]
BUFFER_SIZE = 370
BUFF_BEFORE = 1.5

[Input]
COORDSYS = EPSG:32608
TIME_ZONE = 0
METEO = SMET
METEOPATH = ../input
COLD_START = true
PSUM_PH::create = PRECSPLITTING
PSUM_PH::PRECSPLITTING::type = THRESH
PSUM_PH::PRECSPLITTING::snow = 274.35

[Output]
COORDSYS = EPSG:32608
TIME_ZONE = 0
METEO = SMET
METEOPATH = ../output
EXPERIMENT = heatflux_soiltemp_zero
TS_WRITE = true
TS_FORMAT = SMET
TS_START = 0.0
TS_DAYS_BETWEEN = 0.04166667
PROF_WRITE = true
PROF_FORMAT = PRO
PROF_START = 0.0
PROF_DAYS_BETWEEN = 0.04166667

[Snowpack]
CALCULATION_STEP_LENGTH = 60
MEAS_TSS = false
ENFORCE_MEASURED_SNOW_HEIGHTS = false
SW_MODE = INCOMING
HEIGHT_OF_WIND_VALUE = 10.0
HEIGHT_OF_METEO_VALUES = 2.0
ATMOSPHERIC_STABILITY = MO_HOLTSLAG
ROUGHNESS_LENGTH = 0.002
CHANGE_BC = false
THRESH_CHANGE_BC = -1.0
SNP_SOIL = false
SOIL_FLUX = false
GEO_HEAT = 0.00
CANOPY = false

[SnowpackAdvanced]
SNOW_EROSION = true

[Filters]
PSUM::filter1 = min
PSUM::arg1::soft = true
PSUM::arg1::min = 0.0
TA::filter1 = min_max
TA::arg1::min = 240
TA::arg1::max = 320
RH::filter1 = min_max
RH::arg1::min = 0.01
RH::arg1::max = 1.2
RH::filter2 = min_max
RH::arg2::soft = true
RH::arg2::min = 0.05
RH::arg2::max = 1.0
ISWR::filter1 = min_max
ISWR::arg1::min = -10
ISWR::arg1::max = 1500
ISWR::filter2 = min_max
ISWR::arg2::soft = true
ISWR::arg2::min = 0
ISWR::arg2::max = 1500
RSWR::filter1 = min_max
RSWR::arg1::min = -10
RSWR::arg1::max = 1500
ILWR::filter1 = min_max
ILWR::arg1::min = 188
ILWR::arg1::max = 600
VW::filter1 = min_max
VW::arg1::min = 0.0
VW::arg1::max = 50.0

[Generators]
TSG::generator1 = CST
TSG::arg1::value = 273.15

